<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iCloud – Find My iPhone</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #000000;
    color: #fff;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* Dark iCloud Topbar */
  .icloud-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 44px;
    width: 100%;
    height: 44px;
    padding: 0 12px 0 14px;
    background-color: #141414;
    border-bottom: 1px solid #262626;
    user-select: none;
    z-index: 20;
  }

  .icloud-topbar__left,
  .icloud-topbar__right {
    display: flex;
    align-items: center;
  }

  .icloud-brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    line-height: 1;
    white-space: nowrap;
  }

  .icloud-apple-logo {
    display: block;
    width: 15px;
    height: 18px;
    color: #f5f5f7;
    margin-right: 5px;
    transform: translateY(-1px);
    flex-shrink: 0;
  }

  .icloud-wordmark {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: #f5f5f7;
    margin-right: 5px;
  }

  .icloud-app-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #34c759;
  }

  .icloud-topbar__right {
    gap: 14px;
  }

  .icloud-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #e5e5ea;
    outline: none;
    transition: opacity 0.15s ease;
  }

  .icloud-btn:hover {
    opacity: 0.8;
  }

  .icloud-btn:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.65);
    outline-offset: 2px;
    border-radius: 999px;
  }

  .icloud-alert-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: #c94a16;
    color: #fff3eb;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
  }

  .icloud-alert-btn span {
    transform: translateY(-0.5px);
  }

  .icloud-add-btn {
    width: 22px;
    height: 22px;
    color: #e5e5ea;
  }

  .icloud-add-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .icloud-apps-btn {
    width: 22px;
    height: 22px;
    color: #e5e5ea;
  }

  .icloud-apps-btn svg {
    width: 18px;
    height: 13px;
    display: block;
  }

  .icloud-avatar-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    overflow: hidden;
    background-color: #2c2c2e;
    flex-shrink: 0;
  }

  .icloud-avatar-img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* Map & Bottom Sheet */
  #map {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    filter: contrast(1.04) saturate(0.9) blur(0px);
    transition: filter 1.1s ease;
  }

  #map.map--blurred {
    filter: contrast(1.04) saturate(0.9) blur(3px);
  }

  .sheet {
    position: relative;
    flex: 0 0 auto;
    width: 100%;
    max-width: 500px;
    margin: -18px auto 0;
    z-index: 10;
    background: #1c1c1e;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 10px 16px 22px;
  }

  .grabber {
    width: 36px;
    height: 5px;
    background: #48484a;
    border-radius: 3px;
    margin: 0 auto 14px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .device-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .device-thumb {
    width: 72px;
    height: 132px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    border-radius: 10px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 4px;
    color: #fff;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #98989f;
    font-size: 16px;
    margin-top: 2px;
  }

  
  @keyframes onlineBlink {
    0%, 100% {
      opacity: 1;
      transform: scale(1);
      box-shadow:
        0 0 0 5px rgba(62, 207, 142, 0.24),
        0 0 0 10px rgba(62, 207, 142, 0.11);
    }
    50% {
      opacity: 0.32;
      transform: scale(0.82);
      box-shadow:
        0 0 0 2px rgba(62, 207, 142, 0.12),
        0 0 0 4px rgba(62, 207, 142, 0.04);
    }
  }

  .status-online {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-left: 12px;
    font-size: 15px;
    font-weight: 500;
    color: #3ecf8e;
    line-height: 1;
  }

  .status-online__dot {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ecf8e;
    animation: onlineBlink 1.35s ease-in-out infinite;
    flex-shrink: 0;
  }

  .batt-low {
    width: 24px;
    height: 11px;
    border: 1px solid #98989f;
    border-radius: 3px;
    position: relative;
    display: inline-block;
  }

  .batt-low::after {
    content: "";
    position: absolute;
    left: 1px;
    top: 1px;
    bottom: 1px;
    width: 4px;
    background: #e53935;
    border-radius: 1px;
  }

  .close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3a3a3c;
    border: 0;
    font-size: 18px;
    color: #aeaeb2;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 16px;
  }

  .card {
    background: #2c2c2e;
    border-radius: 16px;
    padding: 16px;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.25;
    color: #fff;
  }

  .card p {
    color: #98989f;
    font-size: 18px;
    line-height: 1.25;
    margin-top: 2px;
  }

  .lost {
    margin-top: 14px;
  }

  .lost .icon {
    background: #f5961e;
  }
</style>
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com">
<link rel="preconnect" href="https://ipwho.is">
<link rel="preconnect" href="https://ipapi.co">
</head>
<body>

  <header class="icloud-topbar" role="banner">
    <div class="icloud-topbar__left">
      <a class="icloud-brand" href="#" aria-label="iCloud Trouver des appareils">
        <svg class="icloud-apple-logo" viewBox="0 0 170 170" aria-hidden="true">
          <path fill="currentColor" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.13-1.9-14.34-6.08-3.69-3.03-7.61-7.82-11.77-14.37-5.03-7.92-9.16-17.1-12.38-27.54-3.22-10.44-4.83-20.17-4.83-29.19 0-11.26 2.81-20.42 8.43-27.49 5.62-7.07 12.69-10.72 21.21-10.95 4.91 0 10.33 1.38 16.25 4.14 5.92 2.76 9.72 4.18 11.4 4.26 1.34 0 5.56-1.57 12.66-4.71 7.1-3.14 13.1-4.48 18-4.03 13.43 1.08 23.52 6.39 30.27 15.92-12.01 7.28-17.95 17.46-17.82 30.54.11 10.17 3.85 18.63 11.22 25.38 5.26 4.82 11.46 7.87 18.6 9.15-1.49 4.58-3.14 9.01-4.95 13.28zM119.22 32.16c0 7.95-2.91 15.37-8.73 22.26-7.02 8.21-15.52 12.95-24.78 12.21-.12-.99-.19-2.03-.19-3.12 0-7.63 3.32-15.77 9.29-22.49 2.95-3.33 6.69-6.11 11.21-8.33 4.52-2.22 8.78-3.44 12.78-3.66.48 1.22.72 2.43.72 3.63z"/>
        </svg>
        <span class="icloud-wordmark">iCloud</span>
        <span class="icloud-app-title">Trouver des appareils</span>
      </a>
    </div>

    <div class="icloud-topbar__right">
      <button type="button" class="icloud-btn icloud-alert-btn" aria-label="Alertes">
        <span>!</span>
      </button>

      <button type="button" class="icloud-btn icloud-add-btn" aria-label="Ajouter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" />
          <path d="M12 8.2v7.6M8.2 12h7.6" stroke-linecap="round" />
        </svg>
      </button>

      <button type="button" class="icloud-btn icloud-apps-btn" aria-label="Applications iCloud">
        <svg viewBox="0 0 21 15" fill="currentColor" aria-hidden="true">
          <circle cx="2.2" cy="2.2" r="1.55" />
          <circle cx="6.35" cy="2.2" r="1.55" />
          <circle cx="10.5" cy="2.2" r="1.55" />
          <circle cx="14.65" cy="2.2" r="1.55" />
          <circle cx="18.8" cy="2.2" r="1.55" />

          <circle cx="2.2" cy="7.5" r="1.55" />
          <circle cx="6.35" cy="7.5" r="1.55" />
          <circle cx="10.5" cy="7.5" r="1.55" />
          <circle cx="14.65" cy="7.5" r="1.55" />
          <circle cx="18.8" cy="7.5" r="1.55" />

          <circle cx="2.2" cy="12.8" r="1.55" />
          <circle cx="6.35" cy="12.8" r="1.55" />
          <circle cx="10.5" cy="12.8" r="1.55" />
          <circle cx="14.65" cy="12.8" r="1.55" />
          <circle cx="18.8" cy="12.8" r="1.55" />
        </svg>
      </button>

      <button type="button" class="icloud-btn icloud-avatar-btn" aria-label="Compte utilisateur">
        <img
          class="icloud-avatar-img"
          src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%239aa0a8'/%3E%3Cstop offset='100%25' stop-color='%236c7179'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='16' fill='url(%23bg)'/%3E%3Ccircle cx='16' cy='11.5' r='4.8' fill='%23f2f3f5'/%3E%3Cpath d='M6.5 27.5c0-5.1 4.2-8.5 9.5-8.5s9.5 3.4 9.5 8.5' fill='%23f2f3f5'/%3E%3C/svg%3E"
          alt="Profil Apple par défaut"
        />
      </button>
    </div>
  </header>

  <div id="map" aria-label="Google Map showing approximate location based on IP address"></div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="header">
      <div class="device-title-row">
        <img
          class="device-thumb"
          src="https://applesn.info/device-image/27.0/iPhone/iPhone17,2-3b3b3c-404041/online-nolocation_iphone__3x.png"
          alt="iPhone"
        />
        <div>
          <h1>iPhone</h1>
          <div class="meta"><span>1 minute ago</span><span class="batt-low"></span><span class="status-online" aria-label="Online"><span class="status-online__dot" aria-hidden="true"></span>Online</span></div>
        </div>
      </div>
      <button class="close" aria-label="Close">✕</button>
    </div>

    <div class="actions">
      <div class="card">
        <div class="icon" style="background:#5856d6">▶</div>
        <h2>Play Sound</h2>
        <p>Off</p>
      </div>
      <div class="card">
        <div class="icon" style="background:#2f7df6">↱</div>
        <h2>Directions</h2>
      </div>
    </div>

    <div class="card lost">
      <div class="icon">?</div>
      <h2>Lost iPhone</h2>
    </div>
  </div>

<script>
let map;

const DARK_MAP_STYLES = [
  { elementType: 'geometry', stylers: [{ color: '#181b20' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#181b20' }] },
  { elementType: 'labels.text.fill', stylers: [{ color: '#8e96a4' }] },
  {
    featureType: 'administrative',
    elementType: 'geometry.stroke',
    stylers: [{ color: '#2d333b' }]
  },
  {
    featureType: 'administrative.locality',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#c9d1d9' }]
  },
  {
    featureType: 'poi',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#7d8590' }]
  },
  {
    featureType: 'poi.park',
    elementType: 'geometry',
    stylers: [{ color: '#16221d' }]
  },
  {
    featureType: 'poi.park',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#5c8d76' }]
  },
  {
    featureType: 'road',
    elementType: 'geometry',
    stylers: [{ color: '#262b33' }]
  },
  {
    featureType: 'road',
    elementType: 'geometry.stroke',
    stylers: [{ color: '#1c2026' }]
  },
  {
    featureType: 'road',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#9ea7b3' }]
  },
  {
    featureType: 'road.highway',
    elementType: 'geometry',
    stylers: [{ color: '#343b46' }]
  },
  {
    featureType: 'road.highway',
    elementType: 'geometry.stroke',
    stylers: [{ color: '#1f242c' }]
  },
  {
    featureType: 'road.highway',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#d0d7de' }]
  },
  {
    featureType: 'transit',
    elementType: 'geometry',
    stylers: [{ color: '#21262e' }]
  },
  {
    featureType: 'transit.station',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#8b949e' }]
  },
  {
    featureType: 'water',
    elementType: 'geometry',
    stylers: [{ color: '#0d1520' }]
  },
  {
    featureType: 'water',
    elementType: 'labels.text.fill',
    stylers: [{ color: '#587596' }]
  }
];

const ipLocationPromise = (async () => {
  const providers = [
    async () => {
      const r = await fetch('https://ipwho.is/', {cache:'no-store'});
      if(!r.ok) throw new Error('ipwho.is failed');
      const d = await r.json();
      if(!d.success || typeof d.latitude !== 'number' || typeof d.longitude !== 'number') throw new Error('No coordinates');
      return {lat:d.latitude, lng:d.longitude};
    },
    async () => {
      const r = await fetch('https://ipapi.co/json/', {cache:'no-store'});
      if(!r.ok) throw new Error('ipapi failed');
      const d = await r.json();
      if(typeof d.latitude !== 'number' || typeof d.longitude !== 'number') throw new Error('No coordinates');
      return {lat:d.latitude, lng:d.longitude};
    }
  ];
  for (const provider of providers) { try { return await provider(); } catch(e) {} }
  return null;
})();

async function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: {lat: 20, lng: 0},
    zoom: 2,
    mapTypeId: 'roadmap',
    styles: DARK_MAP_STYLES,
    backgroundColor: '#121417',
    disableDefaultUI: true,
    zoomControl: false,
    gestureHandling: 'greedy'
  });
  const loc = await ipLocationPromise;
  if (!loc) { document.title = 'Google Maps — IP location unavailable'; return; }
  map.panTo(loc);
  const startZoom = 2;
  const endZoom = 16;
  map.setZoom(startZoom);
  let currentZoom = startZoom;
  const zoomTimer = setInterval(() => {
    if (currentZoom >= endZoom) { clearInterval(zoomTimer); return; }
    currentZoom += 1;
    map.setZoom(currentZoom);
  }, 220);
  new google.maps.Marker({position:loc, map, title:'Approximate IP location'});


}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxUJRZlcKFGYI5UKOu52lQV-aACGxLtSs&callback=initMap"></script>
<script>
setTimeout(() => {
  const mapEl = document.getElementById('map');
  if (mapEl) mapEl.classList.add('map--blurred');
}, 4000);
</script>

  ">

</body>
